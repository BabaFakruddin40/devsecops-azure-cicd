# .github/workflows/gitops-cicd-azure.yml
# CI/CD pipeline for Skills Tracker app: Build & push to Azure Container Registry, deploy to AKS

name: Azure AKS CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push-acr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image to ACR
        uses: docker/build-push-action@v5
        with:
          context: ./skills_app
          file: ./skills_app/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/skills-tracker:latest

  deploy-to-aks:
    needs: build-and-push-acr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: manifests

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Update image in deployment manifest
        run: |
          cd manifests
          sed -i 's|image: .*/skills-tracker:.*|image: ${{ secrets.ACR_LOGIN_SERVER }}/skills-tracker:latest|' deployment.yaml

      - name: Deploy to AKS
        run: |
          kubectl apply -f manifests/deployment.yaml
          kubectl apply -f manifests/service.yaml

      - name: Get Service Endpoint
        id: get_endpoint
        run: |
          svc_ip=$(kubectl get svc skills-tracker-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "::set-output name=endpoint::http://$svc_ip:5000"

    outputs:
      endpoint: ${{ steps.get_endpoint.outputs.endpoint }}

  print-endpoint:
    needs: deploy-to-aks
    runs-on: ubuntu-latest
    steps:
      - name: Show Application Endpoint
        run: |
          echo "Your Skills Tracker app is available at: ${{ needs.deploy-to-aks.outputs.endpoint }}"

# Notes:
# - Set the following secrets in your GitHub repo: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, ACR_LOGIN_SERVER, ACR_USERNAME, ACR_PASSWORD, AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME
# - manifests/deployment.yaml and manifests/service.yaml must exist and reference the correct image and service name (skills-tracker-service)
# - The endpoint will be printed in the Actions log after deployment
