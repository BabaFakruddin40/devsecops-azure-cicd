apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skills-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/<your-org-or-user>/<your-repo>'
    targetRevision: HEAD
    path: k8s-manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
