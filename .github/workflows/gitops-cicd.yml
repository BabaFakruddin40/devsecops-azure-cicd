# .github/workflows/gitops-cicd.yml
# GitOps-style CI/CD pipeline for Skills Tracker app (Docker + K8s)

name: GitOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./skills_app
          file: ./skills_app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/skills-tracker:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MANIFESTS_REPO }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: manifests

      - name: Update image tag in manifests (if needed)
        run: |
          cd manifests
          # Example: update image tag in k8s deployment YAML
          sed -i 's|image: .*/skills-tracker:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/skills-tracker:latest|' deployment.yaml

      - name: Commit and push manifest changes
        run: |
          cd manifests
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add deployment.yaml
          git commit -m "Update skills-tracker image tag [ci skip]" || echo "No changes to commit"
          git push

# This pipeline builds and pushes the Docker image, then updates a separate GitOps repo with the new image tag.
# ArgoCD/Flux will detect the change and deploy to the cluster automatically.
